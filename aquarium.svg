<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000" height="520" viewBox="0 0 1000 520">

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061b35"/>
      <stop offset="55%" stop-color="#073b59"/>
      <stop offset="100%" stop-color="#031525"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36d9ff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#087ca8" stop-opacity=".04"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07516a"/>
      <stop offset="100%" stop-color="#03101d"/>
    </linearGradient>

    <clipPath id="tank">
      <rect x="12" y="12" width="976" height="496" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tank)">
    <rect width="1000" height="520" fill="url(#water)"/>

    <path d="M0 85 Q180 55 350 85 T700 80 T1000 85"
          fill="none" stroke="#55dfff" stroke-opacity=".12" stroke-width="3"/>

    <g fill="#8deaff" opacity=".55">
      <circle cx="110" cy="125" r="5"/>
      <circle cx="155" cy="205" r="3"/>
      <circle cx="265" cy="155" r="4"/>
      <circle cx="820" cy="130" r="5"/>
      <circle cx="880" cy="205" r="3"/>
      <circle cx="925" cy="105" r="4"/>
      <circle cx="740" cy="220" r="3"/>
      <circle cx="350" cy="215" r="3"/>
    </g>

    <g fill="#36cfff" opacity=".3">
      <circle cx="190" cy="280" r="8"/>
      <circle cx="210" cy="240" r="4"/>
      <circle cx="780" cy="300" r="7"/>
      <circle cx="800" cy="265" r="4"/>
      <circle cx="850" cy="340" r="5"/>
      <circle cx="125" cy="350" r="5"/>
    </g>

    <path d="M0 440 Q250 410 500 445 T1000 435 V520 H0Z"
          fill="url(#floor)"/>

    <g fill="#087b70" opacity=".8">
      <path d="M40 460 Q20 350 70 320 Q60 390 85 460Z"/>
      <path d="M70 460 Q85 345 120 330 Q100 405 105 460Z"/>
      <path d="M940 460 Q920 350 955 315 Q950 400 980 460Z"/>
      <path d="M900 460 Q890 365 920 345 Q915 405 925 460Z"/>
    </g>

    <g fill="#20a68a" opacity=".7">
      <path d="M150 455 Q120 390 155 365 Q160 420 175 455Z"/>
      <path d="M860 455 Q840 390 870 365 Q870 420 885 455Z"/>
    </g>

    <text x="500" y="48" text-anchor="middle"
          font-family="Verdana, sans-serif" font-size="22"
          font-weight="bold" fill="#b9f5ff" letter-spacing="4">
      TAIYAB'S DIGITAL AQUARIUM
    </text>

    <text x="500" y="75" text-anchor="middle"
          font-family="Verdana, sans-serif" font-size="11"
          fill="#70cce8" letter-spacing="3">
      A LIVING PICTURE OF MY GITHUB JOURNEY
    </text>

    <image x="345" y="85" width="310" height="175"
          xlink:href="https://raw.githubusercontent.com/Taiyab2002/Taiyab2002/main/koi/koi.gif"
          preserveAspectRatio="xMidYMid meet"/>

    <rect x="42" y="270" width="916" height="150" rx="12"
          fill="#031b2c" fill-opacity=".72"
          stroke="#31bfe8" stroke-opacity=".5"/>

    <text x="500" y="295" text-anchor="middle"
          font-family="Verdana, sans-serif" font-size="13"
          font-weight="bold" fill="#9beaff" letter-spacing="2">
      GITHUB CONTRIBUTION CURRENT
    </text>

    <image x="55" y="302" width="890" height="105"
          xlink:href="https://raw.githubusercontent.com/Taiyab2002/Taiyab2002/main/activity-graph.svg"
          preserveAspectRatio="xMidYMid meet"/>

    <g fill="#58d8ee" opacity=".7">
      <circle cx="250" cy="465" r="3"/>
      <circle cx="280" cy="480" r="2"/>
      <circle cx="720" cy="465" r="3"/>
      <circle cx="750" cy="485" r="2"/>
    </g>
  </g>

  <rect x="12" y="12" width="976" height="496" rx="22"
        fill="url(#glass)" stroke="#38cfff"
        stroke-opacity=".7" stroke-width="3"/>
</svg>
